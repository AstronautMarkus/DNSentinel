<header class="site-header">
    <div class="container site-header__inner">
        <a class="brand" href="{{ url_for('dashboard.home') if current_user.is_authenticated else url_for('main.index') }}">
            <img class="brand__logo" src="{{ url_for('static', filename='img/DNSentinel.svg') }}" alt="">
            <span>DNSentinel</span>
        </a>
        <nav class="site-nav" aria-label="{{ t('nav.main') }}">
            {% with lang_switch_class = 'site-nav__link' %}{% include 'base/partials/lang_switch.html' %}{% endwith %}
            {% if current_user.is_authenticated %}
                <a class="btn btn--primary btn--sm" href="{{ url_for('dashboard.home') }}">
                    <span>{{ t('nav.go_to_dashboard') }}</span>
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </a>
            {% else %}
                <a class="site-nav__link" href="{{ url_for('auth.login') }}">{{ t('common.sign_in') }}</a>
                <a class="btn btn--primary btn--sm" href="{{ url_for('auth.register') }}">{{ t('common.create_account') }}</a>
            {% endif %}
        </nav>
    </div>
</header>
