<header class="topbar">
    <button type="button" class="btn btn--ghost btn--icon topbar__menu" data-sidebar-toggle aria-controls="sidebar" aria-expanded="true" aria-label="Hide navigation" title="Hide navigation">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
    <a class="brand topbar__brand" href="{{ url_for('dashboard.home') }}">
        <img class="brand__logo" src="{{ url_for('static', filename='img/DNSentinel.svg') }}" alt="">
        <span>DNSentinel</span>
    </a>

    <div class="topbar__spacer"></div>

    <div class="topbar__actions">
        {% if current_user.is_authenticated %}
            <div class="dropdown dropdown--right" data-dropdown>
                <button type="button" class="user-menu" data-dropdown-toggle aria-haspopup="menu" aria-expanded="false">
                    <span class="avatar" aria-hidden="true">{{ current_user.name[:1] | upper }}</span>
                    <span class="user-menu__name">{{ current_user.name }}</span>
                    <i class="fa-solid fa-chevron-down user-menu__caret" aria-hidden="true"></i>
                </button>
                <div class="dropdown__menu" role="menu">
                    <div class="dropdown__header">
                        <strong>{{ current_user.name }}</strong>
                        <span>{{ current_user.email }}</span>
                    </div>
                    <div class="dropdown__divider"></div>
                    <a class="dropdown__item" role="menuitem" href="{{ url_for('auth.logout') }}"
                       data-confirm="You'll be signed out of DNSentinel. Your DNS records will keep updating in the background."
                       data-confirm-title="Log out?"
                       data-confirm-button="Log out"
                       data-confirm-icon="fa-arrow-right-from-bracket">
                        <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
                        <span>Log out</span>
                    </a>
                </div>
            </div>
        {% else %}
            <a class="btn btn--ghost btn--sm" href="{{ url_for('auth.login') }}">Sign in</a>
            <a class="btn btn--primary btn--sm" href="{{ url_for('auth.register') }}">Create account</a>
        {% endif %}
    </div>
</header>
