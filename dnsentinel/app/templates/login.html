{% extends 'base/base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="auth">
    <div class="auth__card">
        <img class="auth__logo" src="{{ url_for('static', filename='img/DNSentinel.svg') }}" alt="DNSentinel">
        <h1 class="auth__title">Sign in</h1>
        <p class="auth__subtitle">Sign in to your DNSentinel account.</p>

        <form method="post" class="form">
            <div class="field">
                <label for="email" class="field__label">Email<span class="field__required" aria-hidden="true">*</span></label>
                <div class="input-group">
                    <i class="fa-solid fa-envelope input-group__icon" aria-hidden="true"></i>
                    <input type="email" class="input" id="email" name="email" required autocomplete="email"
                           placeholder="john@example.com" value="{{ email|default('') }}">
                </div>
            </div>
            <div class="field">
                <label for="password" class="field__label">Password<span class="field__required" aria-hidden="true">*</span></label>
                <div class="input-group">
                    <i class="fa-solid fa-lock input-group__icon" aria-hidden="true"></i>
                    <input type="password" class="input" id="password" name="password" required
                           autocomplete="current-password" placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn btn--primary btn--lg btn--block">Sign in</button>
        </form>

        <p class="auth__footer">Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
    </div>
</section>
{% endblock %}
