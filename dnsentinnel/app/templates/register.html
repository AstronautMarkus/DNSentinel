{% extends 'base/base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="box" style="max-width: 400px; margin: auto;">
    <h2 class="title is-4 has-text-centered">Register</h2>
    <form method="post">
        <div class="field">
            <label for="name" class="label">Name</label>
            <div class="control">
                <input type="text" class="input" id="name" name="name" required>
            </div>
        </div>
        <div class="field">
            <label for="email" class="label">Email</label>
            <div class="control">
                <input type="email" class="input" id="email" name="email" required>
            </div>
        </div>
        <div class="field">
            <label for="password" class="label">Password</label>
            <div class="control">
                <input type="password" class="input" id="password" name="password" required>
            </div>
        </div>
        <div class="field">
            <div class="control">
                <button type="submit" class="button is-primary is-fullwidth">Register</button>
            </div>
        </div>
    </form>
    <p class="mt-3 has-text-centered">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
