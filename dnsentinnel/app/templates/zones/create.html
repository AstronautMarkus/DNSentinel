{% extends 'base/admin_base.html' %}
{% block title %}Create a Zone{% endblock %}
{% block content %}

<div class="section">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-6-tablet is-5-desktop is-4-widescreen">
        <div class="box has-shadow">
          <h1 class="title is-2 has-text-centered mb-2">Create a New DNS Zone</h1>
          <p class="subtitle is-5 has-text-centered mb-5">Fill out the form below to create a new DNS zone.</p>
          <form id="zoneForm" method="POST" action="{{ url_for('zones.create_zone') }}">
            <div class="field">
              <label class="label">Name <span class="has-text-danger">*</span></label>
              <div class="control has-icons-left">
                <input class="input" type="text" name="name" placeholder="Zone Name" required>
                <span class="icon is-small is-left">
                  <i class="fas fa-globe"></i>
                </span>
              </div>
            </div>

            <div class="field">
              <label class="label">Zone Identifier (zone_id) <span class="has-text-danger">*</span></label>
              <div class="control has-icons-left">
                <input class="input" type="text" name="zone_id" placeholder="Zone ID" required>
                <span class="icon is-small is-left">
                  <i class="fas fa-id-badge"></i>
                </span>
              </div>
            </div>

            <div class="field">
              <label class="label">API Token <span class="has-text-danger">*</span></label>
              <div class="control has-icons-left">
                <input class="input" type="text" name="api_token" placeholder="API Token" required>
                <span class="icon is-small is-left">
                  <i class="fas fa-key"></i>
                </span>
              </div>
            </div>

            <div class="field is-grouped is-grouped-centered mt-5">
              <div class="control">
                <button id="validateBtn" class="button is-link is-rounded" type="button">
                  <span class="icon"><i class="fas fa-check-circle"></i></span>
                  <span>Validate Credentials</span>
                </button>
                <button id="createBtn" class="button is-success is-rounded is-hidden" type="submit">
                  <span class="icon"><i class="fas fa-plus-circle"></i></span>
                  <span>Create Zone</span>
                </button>
              </div>
              <div class="control">
                <a class="button is-light is-rounded" href="{{ url_for('dashboard.home') }}">
                  <span class="icon"><i class="fas fa-times"></i></span>
                  <span>Cancel</span>
                </a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
{{ super() }}
<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('zoneForm');
  const validateBtn = document.getElementById('validateBtn');
  const createBtn = document.getElementById('createBtn');

  // Solo permite submit cuando ya se validó
  let validated = false;

  validateBtn.addEventListener('click', function() {
    const name = form.elements['name'].value;
    const zone_id = form.elements['zone_id'].value;
    const api_token = form.elements['api_token'].value;

    Swal.fire({
      title: 'Validating...',
      text: 'Checking credentials with Cloudflare',
      allowOutsideClick: false,
      didOpen: () => {
        Swal.showLoading();
      }
    });

    fetch("{{ url_for('zones.validate_zone') }}", {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({zone_id, api_token})
    })
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        Swal.fire({
          icon: 'success',
          title: 'Validated!',
          html: `<p>${data.msg}</p>`,
          confirmButtonText: 'OK',
          allowOutsideClick: false
        }).then(() => {
          validated = true;
          validateBtn.classList.add('is-hidden');
          createBtn.classList.remove('is-hidden');
        });
      } else {
        Swal.fire({
          icon: 'error',
          title: 'Validation Error',
          html: `<p>${data.msg}</p>`,
          confirmButtonText: 'OK',
          allowOutsideClick: false
        });
      }
    })
    .catch(() => {
      Swal.fire({
        icon: 'error',
        title: 'Error',
        html: '<p>Could not validate. Please try again or check your connection.</p>',
        confirmButtonText: 'OK',
        allowOutsideClick: false
      });
    });
  });

  form.addEventListener('submit', function(e) {
    if (!validated) {
      e.preventDefault();
      Swal.fire({
        icon: 'warning',
        title: 'Please validate credentials first',
        confirmButtonText: 'OK'
      });
    }
  });
});
</script>
{% endblock %}
