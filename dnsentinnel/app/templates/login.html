{% extends 'base/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="box" style="max-width: 400px; margin: auto;">
    <h2 class="title is-4 has-text-centered">Login</h2>
    <form method="post">
        <div class="field">
            <label for="email" class="label">Email</label>
            <div class="control">
                <input type="email" class="input" id="email" name="email" required placeholder="john@example.com" value="{{ email|default('') }}">
            </div>
        </div>
        <div class="field">
            <label for="password" class="label">Password</label>
            <div class="control">
                <input type="password" class="input" id="password" name="password" required placeholder="********">
            </div>
        </div>
        <div class="field">
            <div class="control">
                <button type="submit" class="button is-primary is-fullwidth">Sign in</button>
            </div>
        </div>
    </form>
    <p class="mt-3 has-text-centered">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
</div>
{% endblock %}
