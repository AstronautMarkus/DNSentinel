{% extends 'base/admin_base.html' %}
{% block title %}Create a Record{% endblock %}
{% block content %}

<div class="section">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-6-tablet is-5-desktop is-4-widescreen">
        <div class="box has-shadow">
          <h1 class="title is-2 has-text-centered mb-2">Create a New DNS Record</h1>
          <p class="subtitle is-5 has-text-centered mb-5">Fill out the form below to create a new DNS record.</p>
          <form id="recordForm" method="POST" action="">
            <div class="field">
              <label class="label">Name <span class="has-text-danger">*</span></label>
              <div class="control has-icons-left">
                <input class="input" type="text" name="name" placeholder="Record Name" required>
                <span class="icon is-small is-left">
                  <i class="fas fa-globe"></i>
                </span>
              </div>
            </div>

            <div class="field">
              <label class="label">Type <span class="has-text-danger">*</span></label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select name="type" required>
                    <option value="">Select type</option>
                    <option value="A">A</option>
                    <option value="AAAA">AAAA</option>
                    <option value="CNAME">CNAME</option>
                    <option value="MX">MX</option>
                    <option value="TXT">TXT</option>
                    <option value="SRV">SRV</option>
                    <option value="NS">NS</option>
                    <option value="PTR">PTR</option>
                    <option value="CAA">CAA</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="field">
              <label class="label">TTL <span class="has-text-danger">*</span></label>
              <div class="control has-icons-left">
                <input class="input" type="number" name="ttl" placeholder="TTL (seconds)" min="1" required>
                <span class="icon is-small is-left">
                  <i class="fas fa-clock"></i>
                </span>
              </div>
            </div>

            <div class="field">
              <label class="checkbox">
                <input type="checkbox" name="proxied">
                Proxied
              </label>
            </div>

            <div class="field">
              <label class="checkbox">
                <input type="checkbox" name="active" checked>
                Active
              </label>
            </div>

            <div class="field is-grouped is-grouped-centered mt-5">
              <div class="control">
                <button class="button is-success is-rounded" type="submit">
                  <span class="icon"><i class="fas fa-plus-circle"></i></span>
                  <span>Create Record</span>
                </button>
              </div>
              <div class="control">
                <a class="button is-light is-rounded" href="{{ url_for('records.list_records', zone_id=zone_id) }}">
                  <span class="icon"><i class="fas fa-times"></i></span>
                  <span>Cancel</span>
                </a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
{{ super() }}
<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('recordForm');

  form.addEventListener('submit', function(e) {
    const name = form.elements['name'].value;
    const type = form.elements['type'].value;
    const ttl = form.elements['ttl'].value;

    if (!name || !type || !ttl) {
      e.preventDefault();
      Swal.fire({
        icon: 'warning',
        title: 'Please fill in all required fields',
        confirmButtonText: 'OK'
      });
    }
  });
});
</script>
{% endblock %}
